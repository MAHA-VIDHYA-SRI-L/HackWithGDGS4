<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f5f3ee"/>
  <!-- grid lines -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#e0ddd6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <!-- top bar -->
  <rect width="1200" height="60" fill="#0A0A0A"/>
  <!-- GDG dots -->
  <circle cx="40" cy="30" r="7" fill="#4285F4"/>
  <circle cx="56" cy="30" r="7" fill="#EA4335"/>
  <circle cx="72" cy="30" r="7" fill="#FBBC05"/>
  <circle cx="88" cy="30" r="7" fill="#34A853"/>
  <text x="104" y="35" font-family="monospace" font-size="13" fill="#f5f3ee" letter-spacing="2">GDG ON CAMPUS KSRCE</text>
  <!-- main headline -->
  <text x="80" y="240" font-family="sans-serif" font-weight="700" font-size="110" fill="#0A0A0A" letter-spacing="-6">HACK WITH</text>
  <text x="80" y="360" font-family="sans-serif" font-weight="700" font-size="110" fill="#4285F4" letter-spacing="-6">GDG</text>
  <text x="310" y="360" font-family="sans-serif" font-weight="700" font-size="110" fill="#EA4335" letter-spacing="-6"> S4</text>
  <!-- sub line -->
  <line x1="80" y1="400" x2="1120" y2="400" stroke="#e0ddd6" stroke-width="1"/>
  <text x="80" y="440" font-family="monospace" font-size="18" fill="#888580" letter-spacing="3">OCTOBER 8–10, 2026</text>
  <text x="80" y="468" font-family="monospace" font-size="18" fill="#888580" letter-spacing="3">KSR COLLEGE OF ENGINEERING, NAMAKKAL</text>
  <!-- accent bar bottom -->
  <rect x="0" y="610" width="300" height="4" fill="#4285F4"/>
  <rect x="300" y="610" width="300" height="4" fill="#EA4335"/>
  <rect x="600" y="610" width="300" height="4" fill="#FBBC05"/>
  <rect x="900" y="610" width="300" height="4" fill="#34A853"/>
</svg>
